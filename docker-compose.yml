# ===========================================================================
# JobPilot — self-hosted job-search assistant.
#
#   cp .env.example .env          # then set SECRET_KEY (and optionally your
#   docker compose up -d --build  # Anthropic key — the UI can set it instead)
#
# Open http://localhost:1456.
#
# Services
#   app     FastAPI: UI + REST + WebSocket on 1456. Applies migrations and
#           seeds the demo account on first boot.
#   worker  arq queue runner with a headful Playwright Chromium under Xvfb,
#           shared to the authenticated UI over noVNC so a human can solve a
#           CAPTCHA in the real page. Software never solves one.
#   db      Postgres 16.
#   redis   Redis 7 (queue + pub/sub).
#   plugin  On-demand, profile-gated: copies the browser extension out of the
#           app image to ./plugin. Never starts with `up`.
#
# Everyday commands
#   docker compose up -d --build                     # start / update
#   docker compose logs -f app                       # follow the app log
#   docker compose --profile plugin run --rm plugin  # extension → ./plugin
#   docker compose down                              # stop
#   docker compose down -v                           # stop and DELETE all data
#
# Compose names volumes after this directory. If you rename or move the
# folder, pass `-p <old-name>` (or add `name:` here) or the stack comes up
# pointing at empty volumes and your data will look gone.
# ===========================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Named explicitly so the `plugin` service below can reuse this exact
    # image — the extension you install then matches the server you run.
    image: jobpilot-app:local
    ports:
      - "1456:1456"
    env_file:
      # Optional: a missing .env is not a startup error. Every value below has
      # a working default, and SECRET_KEY is generated once into the uploads
      # volume if you don't set one. (Needs Compose v2.24+; on anything older
      # `touch .env` next to this file.)
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot}@db:5432/${POSTGRES_DB:-jobpilot}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      PORT: "1456"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1456/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First boot runs migrations and the seed before the port answers.
      start_period: 90s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      # Optional: a missing .env is not a startup error. Every value below has
      # a working default, and SECRET_KEY is generated once into the uploads
      # volume if you don't set one. (Needs Compose v2.24+; on anything older
      # `touch .env` next to this file.)
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot}@db:5432/${POSTGRES_DB:-jobpilot}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      PLAYWRIGHT_HEADFUL: "true"
    ports:
      # noVNC viewer, embedded in the authenticated JobPilot UI for remote
      # CAPTCHA solving. Bound to localhost by default — do not expose raw.
      - "127.0.0.1:6080:6080"
    volumes:
      - uploads:/data/uploads
      - pw-browsers:/ms-playwright
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not just "db is up": the app owns the migrations, and arq would
      # otherwise start querying tables that do not exist yet on first boot.
      app:
        condition: service_healthy
    # Chromium writes shared memory here; the 64 MB default crashes tabs on
    # heavy application pages.
    shm_size: "1gb"
    # Let an in-flight application finish its current step and close the
    # browser cleanly instead of being killed mid-form.
    stop_grace_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Copies the browser-extension bundles out of the app image onto this
  # machine. Not part of `up` — it is profile-gated and runs once, on demand:
  #   docker compose --profile plugin run --rm plugin
  # Needs no database, no Redis and no network; it only unloads files the
  # image already carries.
  plugin:
    profiles: ["plugin"]
    build:
      context: .
      dockerfile: Dockerfile
    image: jobpilot-app:local  # same image as `app`; built once, reused here
    entrypoint: ["/bin/sh", "-c"]
    # One list item, so it stays one argument to `sh -c` instead of being
    # split into separate argv entries.
    command:
      - |
        set -e
        cp -r /app/app/extension_dist/. /out/
        echo "JobPilot extension v$$(cat /out/VERSION) written to ./plugin:"
        ls -1 /out
    volumes:
      - ./plugin:/out
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpilot} -d ${POSTGRES_DB:-jobpilot}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    # Queue state is rebuildable, but an fsync-on-append costs nothing here
    # and keeps a restart from losing in-flight jobs.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  redisdata:
  uploads:
  pw-browsers:
