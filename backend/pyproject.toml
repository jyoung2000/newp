[project]
name = "jobpilot-backend"
version = "0.1.0"
description = "JobPilot — self-hosted job-search assistant (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "redis>=5.0",
    "arq>=0.26",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "anthropic>=0.69",
    "websockets>=12.0",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "cryptography>=42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-qrcode",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# conftest configures the environment before importing app modules.
"tests/conftest.py" = ["E402"]
"alembic/versions/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
